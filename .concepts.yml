# Cross-cutting concept registry for flame-mcp.
#
# Purpose: declare every load-bearing concept that is replicated across code,
# docs, configs, or external systems, together with a machine-checkable
# invariant. The invariant is evaluated by `python scripts/verify_concepts.py`
# and enforced by the pre-commit hook.
#
# Soft-launch mode: while `strict: false`, drifts are reported but commits are
# NOT blocked. Flip to `strict: true` after all known drifts are resolved.
#
# Schema reference:
#   schema_version : int
#   repo           : str
#   strict         : bool
#   concepts       : mapping of <concept_name> -> concept definition
#
# Concept definition:
#   description    : short human explanation (1 line)
#   source_of_truth: optional pointer to the canonical location
#   mirrors        : optional list of doc/config locations that replicate it
#   invariants     : list of checks (see scripts/invariant_types.py)
#
# Each invariant has:
#   id    : stable identifier, shown in the report
#   type  : one of {tool_count, subset, file_exists, version_match,
#                   claim_verifies, review_expiry}
#   plus the type-specific parameters documented in invariant_types.py.

schema_version: 1
repo: flame-mcp

# Strict mode: pre-commit blocks commits on any unresolved drift.
# Flipped from false → true on 2026-04-20 (Chat 46), after release-flow
# tension was resolved via changelog_tag_sync tolerance + cut-release.sh.
strict: true

# Registry starts empty. Concepts are added TDD-style in Paso 2:
#   1. Declare the concept + invariant here.
#   2. Run `python scripts/verify_concepts.py` → should FAIL (drift confirmed).
#   3. Fix the drift in code / docs.
#   4. Run `python scripts/verify_concepts.py` → should PASS.
#   5. Commit the three changes together (code fix + doc fix + registry entry).

concepts:

  mcp_tool_inventory:
    description: >
      @mcp.tool()-decorated functions in server.py must match the count
      declared in the README heading ("## MCP Tools (N)") and each function
      name must appear in the README tool table (bidirectional).
    source_of_truth:
      file: src/flame_mcp/server.py
      symbol: "@mcp.tool() decorators"
    mirrors:
      - file: README.md
        section: "## MCP Tools"
        anchors: [mcp_tool_count, mcp_tool_table]
      - file: install.sh
        kind: generated  # auto-extracted via ast.parse — no drift possible
    invariants:

      - id: readme_tool_count_matches_code
        type: tool_count
        code_file: src/flame_mcp/server.py
        decorator: mcp.tool
        doc_file: README.md
        concept_id: mcp_tool_count

      - id: readme_tool_names_bidirectional
        type: subset
        direction: bidirectional
        a_source:
          type: ast_decorator_functions
          file: src/flame_mcp/server.py
          decorator: mcp.tool
        b_source:
          type: anchor_list
          file: README.md
          concept_id: mcp_tool_table
          item_pattern: '`([a-z_][a-z0-9_]*)`'

  llm_models_inventory:
    description: >
      AVAILABLE_MODELS in hooks/flame_mcp_bridge.py is the canonical source
      of model IDs exposed in the chat widget's selector. README.md's backend/
      model table must list every one of them (and vice versa). CLAUDE.md is
      audited separately (next drift).
    source_of_truth:
      file: hooks/flame_mcp_bridge.py
      symbol: AVAILABLE_MODELS
    mirrors:
      - file: README.md
        section: "Model selector dropdown"
        anchors: [llm_backend_table]
    invariants:

      - id: readme_models_bidirectional
        type: subset
        direction: bidirectional
        a_source:
          type: ast_tuple_list_column
          file: hooks/flame_mcp_bridge.py
          symbol: AVAILABLE_MODELS
          column: 1          # model ID column
        b_source:
          type: anchor_list
          file: README.md
          concept_id: llm_backend_table
          # Match any backtick-wrapped identifier that starts with a letter
          # and may contain digits / dots / colons / dashes (model IDs shape).
          item_pattern: '`([a-z][a-z0-9._:-]+)`'

      # install.sh model recommendations must be a subset of AVAILABLE_MODELS
      # (Ollama-only: the install prompts advise what to pull on the LAN box).
      - id: install_sh_ollama_models_subset
        type: subset
        direction: a_subset_b
        a_source:
          type: anchor_list
          file: install.sh
          concept_id: ollama_gpu_models_install
          item_pattern: '`([a-z][a-z0-9._:-]+)`'
        b_source:
          type: ast_tuple_list_column
          file: hooks/flame_mcp_bridge.py
          symbol: AVAILABLE_MODELS
          column: 1

      # Same check for the Linux-side Ollama setup helper.
      - id: setup_linux_ollama_models_subset
        type: subset
        direction: a_subset_b
        a_source:
          type: anchor_list
          file: scripts/setup_ollama_linux.sh
          concept_id: ollama_gpu_models_linux
          item_pattern: '`([a-z][a-z0-9._:-]+)`'
        b_source:
          type: ast_tuple_list_column
          file: hooks/flame_mcp_bridge.py
          symbol: AVAILABLE_MODELS
          column: 1

  anthropic_models:
    description: >
      Anthropic model IDs hardcoded in flame-mcp code must match the
      "current" block in ~/Projects/.external_versions.yml, and that block
      must have been reviewed within its expiry_days (default 14).
      Forces periodic human check against the Anthropic model catalogue.
    source_of_truth:
      file: ~/Projects/.external_versions.yml
      key: anthropic_models.current
    mirrors:
      - file: hooks/flame_mcp_bridge.py
        symbol: AVAILABLE_MODELS (rows where backend == "anthropic")
      - file: src/flame_mcp/server.py
        symbol: WRITE_ALLOWED_MODELS
    invariants:

      - id: anthropic_model_review_fresh
        type: review_expiry
        file: .external_versions.yml
        key: anthropic_models

      - id: bridge_anthropic_models_in_catalogue
        type: subset
        ci_skip: true  # b_source lives outside the repo (~/Projects/.external_versions.yml)
        direction: a_subset_b
        a_source:
          type: ast_tuple_list_column
          file: hooks/flame_mcp_bridge.py
          symbol: AVAILABLE_MODELS
          column: 1
          filter_column: 2
          filter_value: anthropic
        b_source:
          type: yaml_values
          file: .external_versions.yml
          key: anthropic_models.current

  modelfile_references:
    description: >
      Documentation must not reference Modelfile filenames (e.g.
      `Modelfile.qwen35mcp`) that are not tracked in the repo. The bridge
      handles num_ctx at runtime; custom Modelfiles are unnecessary.
    invariants:
      - id: no_dangling_modelfile_reference
        type: claim_verifies
        claim: "No '-f Modelfile.<name>' references in README (the bridge overrides num_ctx at runtime)"
        code_grep:
          regex: '-f Modelfile\.'
          file_pattern: 'README.md'
        expected: not_found

  pyproject_version:
    description: >
      pyproject.toml version field must match the latest annotated git tag.
      Prevents the release-vs-install drift seen at Chat 43 (code at v1.2.1
      while pyproject stuck at v0.1.0, breaking `pip show` and `pip install -e .`).
    source_of_truth:
      file: git
      command: "git describe --tags --abbrev=0"
    mirrors:
      - file: pyproject.toml
        field: '[project].version'
    invariants:
      - id: pyproject_matches_latest_tag
        tolerate_release_in_progress: true  # cut-release.sh sets CUT_RELEASE_VERSION to tolerate the transient drift
        type: version_match
        a:
          source: file_regex
          file: pyproject.toml
          pattern: '^version\s*=\s*"([^"]+)"'
        b:
          source: command
          cmd: "git describe --tags --abbrev=0 | sed 's/^v//'"

  single_install_script_at_root:
    description: >
      Ecosystem rule (Chat 34, ratified Chat 44): each MCP repo has exactly
      ONE install script at the repo root (`install.sh`). Helper scripts that
      install something OTHER than the MCP itself (e.g. Ollama on Linux) live
      under scripts/ with an explicit name.
    source_of_truth:
      file: ~/Projects/.ecosystem_concepts.yml
      key: single_install_script_per_repo
    invariants:
      - id: one_install_script_at_root
        type: glob_count
        patterns:
          - "install*.sh"
          - "setup*.sh"
        expected: 1

  undo_chat_command:
    description: >
      The `/undo` chat command in the flame-mcp Qt widget calls
      flame.execute_shortcut("Undo"). README documents this; the
      implementation must exist.
    source_of_truth:
      file: hooks/flame_mcp_bridge.py
      symbol: "/undo handler"
    invariants:
      - id: undo_shortcut_implementation_present
        type: claim_verifies
        claim: "/undo chat command invokes flame.execute_shortcut('Undo') in the bridge"
        code_grep:
          regex: 'execute_shortcut\([^)]*Undo'
          file_pattern: 'hooks/flame_mcp_bridge.py'
        expected: found

  release_cadence:
    description: >
      Prevent the "18 commits past the last tag" state observed on 2026-04-17.
      Work should be tagged as a release before the backlog grows unbounded.
      Thresholds (ecosystem-wide): 10 commits soft warning, 30 commits hard
      stop. Also flags tags older than 30 days if any commits are pending.
    source_of_truth:
      file: git
      command: "git describe --tags --abbrev=0 && git rev-list --count <tag>..HEAD"
    invariants:
      - id: commits_since_last_tag_under_threshold
        type: commits_since_tag
        warn_commits: 10
        max_commits: 30
        max_age_days: 30

  changelog_tag_coherence:
    description: >
      Every `## [X.Y.Z]` section in CHANGELOG.md must correspond to an
      annotated git tag `vX.Y.Z` (and vice versa, for new tags cut in this
      repo). Catches mid-release inconsistent states and forgotten tags.
      The release-in-progress transient drift (CHANGELOG moved but tag not
      yet created at pre-commit time) is tolerated iff the drifting version
      matches env `CUT_RELEASE_VERSION` (set by scripts/cut-release.sh) OR
      the version declared in pyproject.toml.
    source_of_truth:
      file: CHANGELOG.md
      plus: "git tag --list 'v*'"
    invariants:
      - id: changelog_sections_match_tags
        type: changelog_tag_sync
        direction: bidirectional

  token_cost_warnings_suppressed_on_ollama:
    description: >
      README claims token-cost warnings (🟡 🔴) are suppressed for Ollama
      backends. Implementation: src/flame_mcp/server.py::_rating returns ""
      when backend startswith 'ollama'.
    source_of_truth:
      file: src/flame_mcp/server.py
      symbol: _rating
    invariants:
      - id: rating_skips_ollama
        type: claim_verifies
        claim: "_rating() returns empty string for Ollama backends"
        code_grep:
          regex: 'backend.*startswith.*ollama'
          file_pattern: 'src/flame_mcp/server.py'
        expected: found

  ollama_preflight_parity:
    description: >
      Every Ollama-family backend branch in _agent_loop must call
      _preload_ollama_model() before spawning the claude subprocess, because
      Ollama's Anthropic-compat /v1/messages endpoint ignores Modelfile num_ctx
      and silently falls back to 4096 tokens. Applies to ollama (LAN) and
      ollama_mac; ollama_cloud is deliberately excluded (cloud runners manage
      their own context).
    source_of_truth:
      file: hooks/flame_mcp_bridge.py
      symbol: "_agent_loop (Ollama backend routing)"
    invariants:
      - id: preflight_called_for_ollama_lan
        type: claim_verifies
        claim: "LAN ollama branch calls _preload_ollama_model() before the subprocess spawn"
        code_grep:
          regex: '_preload_ollama_model\(\)'
          file_pattern: 'hooks/flame_mcp_bridge.py'
        expected: found
      - id: preflight_called_for_ollama_mac
        type: claim_verifies
        claim: "ollama_mac branch calls _preload_ollama_model(url=OLLAMA_MAC_URL, ...)"
        code_grep:
          regex: '_preload_ollama_model\([^)]*OLLAMA_MAC_URL'
          file_pattern: 'hooks/flame_mcp_bridge.py'
        expected: found

  stats_keys_schema_shared:
    description: >
      server.py::_stats is initialised via flame_mcp._session_stats.make_empty_stats()
      so the key schema cannot drift between the helper and the server. Prevents
      a new counter from being added to only one side.
    source_of_truth:
      file: src/flame_mcp/_session_stats.py
      symbol: make_empty_stats
    mirrors:
      - file: src/flame_mcp/server.py
        symbol: "_stats (module-level dict)"
    invariants:
      - id: stats_initialised_via_helper
        type: claim_verifies
        claim: "server.py initialises _stats via make_empty_stats()"
        code_grep:
          regex: '_stats\s*=\s*make_empty_stats\(\)'
          file_pattern: 'src/flame_mcp/server.py'
        expected: found

  github_release_per_tag:
    description: >
      Every git tag vX.Y.Z (v1.0.0+) must have a corresponding published GitHub
      Release. Catches tags pushed without `gh release create`. Pre-1.0 tags
      are excluded (v0.x was pre-release noise). Requires `gh` CLI authenticated;
      drift reports will be false-positive if gh is offline or unauthenticated.
    source_of_truth:
      file: git
      command: "git tag --list 'v*'"
    mirrors:
      - command: "gh release list"
    invariants:
      - id: every_v1plus_tag_has_github_release
        type: subset
        ci_skip: true  # b_source shells out to `gh release list` — default GH_TOKEN scope varies
        direction: a_subset_b
        a_source:
          type: command_lines
          cmd: "git tag --list 'v*' | grep -Ev '^v0\\.' | sed 's/^v//'"
        b_source:
          type: command_lines
          cmd: "gh release list --limit 200 --json tagName --jq '.[].tagName' | sed 's/^v//'"

  rag_corpus_docs:
    description: >
      The 'Knowledge base' table in README.md must list exactly the
      `.md` files present as metadata.source in rag/corpus.json.
      Chunk count shown in the table is illustrative ("~N") and not
      enforced, only the filename inventory is.
    source_of_truth:
      file: rag/corpus.json
      field: metadata.source
    mirrors:
      - file: README.md
        anchors: [rag_corpus_docs]
    invariants:
      - id: readme_docs_match_corpus
        type: subset
        direction: bidirectional
        a_source:
          type: json_array_field
          file: rag/corpus.json
          field: metadata.source
        b_source:
          type: anchor_list
          file: README.md
          concept_id: rag_corpus_docs
          # Match any backtick-wrapped .md filename inside the anchored block.
          item_pattern: '`([A-Za-z][A-Za-z0-9_./-]+\.md)`'

  next_suggested_actions_contract:
    description: >
      Every tool registered in SUGGESTION_RULES (suggestions.py) must be
      wired at its @mcp.tool implementation in server.py via a
      `maybe_annotate_with_suggestions("<tool>", out)` call. Unlike
      fpt-mcp/maya-mcp which mutate JSON, flame-mcp appends a visible
      text block — same contract at the registry level.
    source_of_truth:
      file: src/flame_mcp/suggestions.py
      symbol: SUGGESTION_RULES
    mirrors:
      - file: src/flame_mcp/server.py
        kind: maybe_annotate_with_suggestions call-sites
    invariants:
      - id: every_rule_is_wired
        type: subset
        direction: a_subset_b
        a_source:
          type: ast_dict_keys
          file: src/flame_mcp/suggestions.py
          symbol: SUGGESTION_RULES
        b_source:
          type: file_regex_matches
          file: src/flame_mcp/server.py
          pattern: 'maybe_annotate_with_suggestions\("([a-z0-9_]+)"'

  dual_source_routing:
    description: >
      F3a — concept_map → api_graph.json fallback chain. resolve_query
      consults resolve_concept first; on miss, falls back to
      _route_from_graph, which filters trap-flagged entries so adversarial
      golden queries never surface a raw forbidden api_path. Anchors the
      contract so the routing module cannot be silently deleted or
      bypassed in a future refactor.
    source_of_truth:
      file: src/flame_mcp/routing.py
      symbol: resolve_query
    mirrors:
      - file: src/flame_mcp/server.py
        kind: resolve_concept MCP tool delegates to routing.resolve_query
      - file: tests/test_golden.py
        kind: golden suite imports resolve_query (aliased as resolve_concept)
    invariants:
      - id: routing_module_exists
        type: file_exists
        path: src/flame_mcp/routing.py
        context: F3a dual-source routing
      - id: routing_fixture_exists
        type: file_exists
        path: tests/fixtures/api_graph_sample.json
        context: F3a hermetic test fixture
      - id: routing_tests_exist
        type: file_exists
        path: tests/test_routing.py
        context: F3a unit tests
      - id: server_uses_routing
        type: subset
        direction: a_subset_b
        a_source:
          type: file_regex_matches
          file: src/flame_mcp/server.py
          pattern: 'from flame_mcp\.routing import (resolve_query)'
        b_source:
          type: file_regex_matches
          file: src/flame_mcp/routing.py
          pattern: 'def (resolve_query)'

  workspace_snapshot_cache:
    description: >
      F4a — Workspace read tools are decorated with
      @_cache_workspace_read so back-to-back identical calls reuse the
      previous result for up to 12 s (TTL, monotonic-clock based).
      execute_python invalidates the workspace.* bucket unconditionally
      after every exec because the LLM may have mutated Flame state.
      The invalidation-on-write rule is AJUSTE 2 of the chat 51 v2 plan
      (TTL alone was insufficient — a post-delete read within TTL would
      have served the pre-delete view).
    source_of_truth:
      file: src/flame_mcp/_workspace_snapshot.py
      symbol: cache_workspace_read
    mirrors:
      - file: src/flame_mcp/server.py
        kind: "@_cache_workspace_read() decorators on read tools + invalidate call in execute_python"
      - file: tests/test_workspace_snapshot.py
        kind: unit tests covering get/set/invalidate + decorator + concurrency
    invariants:
      - id: workspace_snapshot_module_exists
        type: file_exists
        path: src/flame_mcp/_workspace_snapshot.py
        context: F4a workspace cache module
      - id: workspace_snapshot_tests_exist
        type: file_exists
        path: tests/test_workspace_snapshot.py
        context: F4a unit tests
      - id: execute_python_invalidates_workspace
        type: subset
        direction: a_subset_b
        a_source:
          type: file_regex_matches
          file: src/flame_mcp/server.py
          pattern: '_workspace_(invalidate)\(_WORKSPACE_PREFIX\)'
        b_source:
          type: file_regex_matches
          file: src/flame_mcp/_workspace_snapshot.py
          pattern: 'def (invalidate)'

  ast_dry_run_validator:
    description: >
      F4b — Static AST walker validates every flame.X.Y reference in
      execute_python's incoming snippet against rag/api_graph.json
      (F2-intro output). Rejects hallucinated symbols before the
      socket round-trip. Degrades to no-op when the graph file is
      missing (CI / fresh clone). Opt-in via config.json `ast_dry_run`
      (default true).
    source_of_truth:
      file: src/flame_mcp/_ast_validate.py
      symbol: validate_python
    mirrors:
      - file: src/flame_mcp/server.py
        kind: "execute_python pre-flight call to validate_python"
      - file: tests/test_ast_validate.py
        kind: unit tests covering happy-path + rejection + degradation
    invariants:
      - id: ast_validate_module_exists
        type: file_exists
        path: src/flame_mcp/_ast_validate.py
        context: F4b AST walker module
      - id: ast_validate_tests_exist
        type: file_exists
        path: tests/test_ast_validate.py
        context: F4b unit tests
      - id: execute_python_calls_validator
        type: subset
        direction: a_subset_b
        a_source:
          type: file_regex_matches
          file: src/flame_mcp/server.py
          pattern: 'from flame_mcp\._ast_validate import (validate_python)'
        b_source:
          type: file_regex_matches
          file: src/flame_mcp/_ast_validate.py
          pattern: 'def (validate_python)'
