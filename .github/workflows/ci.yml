name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov pyyaml

      - name: Run tests (with coverage)
        run: |
          # --ignore the live-Flame harness: defense-in-depth so it can never
          # arm in CI even if a stray FLAME_LIVE secret leaks into the env.
          python -m pytest tests/ --ignore=tests/test_flame_live.py -p no:warnings --cov=flame_mcp --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    continue-on-error: false  # Chat 47: baseline cleaned, lint is now blocking
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/ --output-format=github

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    continue-on-error: false  # Chat 47: baseline cleared, mypy is now blocking
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package + mypy
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mypy

      - name: Run mypy
        run: mypy src/flame_mcp --ignore-missing-imports --no-strict-optional

  concepts:
    name: verify_concepts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Run verify_concepts.py
        run: python scripts/verify_concepts.py
